<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Chai Vol. 4 – Speaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
  /* ---------- Pixel Chai palette ---------- */
  :root{
    --milk:      #F4E7D3;  /* milky chai: background */
    --milk-deep: #EAD7BC;  /* cup-ring stains, quiet panels */
    --decoction: #3A2217;  /* strong chai: primary text */
    --cinnamon:  #8A4B2A;  /* secondary text */
    --kulhad:    #C4552F;  /* terracotta accent: the one loud colour */
    --ginger:    #E9A23B;  /* warm highlight, used sparingly */
    --cardamom:  #6F7D4E;  /* tiny secondary accent */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;background:var(--milk)}
  body{font-family:"DM Sans",sans-serif;color:var(--decoction);position:relative;overflow:hidden}

  /* paper grain */
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}

  /* cup-ring stain, the brand motif */
  .ring{position:absolute;border-radius:50%;pointer-events:none}
  .ring svg{width:100%;height:100%;display:block}

  .wrap{position:absolute;inset:0;padding:84px 88px 80px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:baseline;gap:14px}
  .logo .word{font-family:"Fraunces",serif;font-weight:800;font-size:44px;letter-spacing:-.5px;
    font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 72}
  .logo .word i{font-style:italic;font-weight:500;color:var(--kulhad)}
  .vol{font-weight:700;font-size:19px;letter-spacing:3px;text-transform:uppercase;
    border:2px solid var(--decoction);border-radius:999px;padding:8px 18px 7px}
  .city{font-weight:500;font-size:19px;letter-spacing:3px;text-transform:uppercase;color:var(--cinnamon)}

  /* ---------- kicker ---------- */
  .kicker{margin-top:118px;display:flex;align-items:center;gap:18px;
    font-weight:700;font-size:21px;letter-spacing:4px;text-transform:uppercase;color:var(--kulhad)}
  .kicker .dash{width:56px;height:3px;background:var(--kulhad);border-radius:2px}

  /* ---------- talk title (hero) ---------- */
  h1{margin-top:30px;font-family:"Fraunces",serif;font-weight:600;font-size:146px;line-height:.93;
    letter-spacing:-4.5px;font-variation-settings:"SOFT" 60,"WONK" 0,"opsz" 144}
  h1 .trust{position:relative;display:inline-block;font-style:italic;font-weight:500;color:var(--kulhad);
    font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;padding-right:6px}
  h1 .trust svg{position:absolute;left:-14px;bottom:-26px;width:calc(100% + 36px);height:46px;overflow:visible}
  h1 .soft{font-weight:400;font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144}

  /* ---------- speaker ---------- */
  .speaker{margin-top:96px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .who .label{font-family:"Caveat",cursive;font-size:42px;color:var(--cinnamon);transform:rotate(-3deg);
    display:inline-block;margin-bottom:6px;margin-left:2px}
  .who .name{font-family:"Fraunces",serif;font-weight:700;font-size:84px;letter-spacing:-2px;line-height:1;
    font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 96}
  .who .role{margin-top:16px;font-size:27px;font-weight:500;color:var(--cinnamon);line-height:1.3}
  .who .role b{color:var(--decoction);font-weight:700}

  /* rotating-text stamp */
  .stamp{position:relative;width:208px;height:208px;flex:0 0 208px;transform:rotate(-12deg);margin-bottom:46px}
  .stamp svg{width:100%;height:100%}
  .stamp .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Fraunces",serif;color:var(--milk)}
  .stamp .core .n{font-size:84px;font-weight:800;line-height:.8;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 96}
  .stamp .core .t{font-family:"DM Sans";font-size:14px;font-weight:700;letter-spacing:3px;margin-top:8px;text-transform:uppercase}

  /* ---------- details ticket ---------- */
  .ticket{position:absolute;left:88px;right:88px;bottom:80px;height:168px;background:var(--decoction);color:var(--milk);
    border-radius:28px;display:grid;grid-template-columns:1fr 1fr 1.55fr;align-items:center;padding:0 46px}
  .ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:var(--milk)}
  .ticket::before{left:-18px}.ticket::after{right:-18px}
  .cell{padding:0 26px;border-left:2px dashed rgba(244,231,211,.28)}
  .cell:first-child{border-left:0;padding-left:0}
  .cell .k{font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ginger)}
  .cell .v{margin-top:10px;font-family:"Fraunces",serif;font-weight:600;font-size:40px;line-height:1.05;letter-spacing:-.5px;
    font-variation-settings:"SOFT" 100,"opsz" 48}
  .cell .v small{display:block;font-family:"DM Sans";font-size:20px;font-weight:500;letter-spacing:0;margin-top:6px;color:rgba(244,231,211,.72)}

  .rsvp{position:absolute;right:88px;bottom:268px;font-size:19px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    color:var(--decoction);display:flex;align-items:center;gap:12px}
  .rsvp .dot{width:12px;height:12px;border-radius:50%;background:var(--cardamom)}
</style>
</head>
<body>

<!-- cup-ring stains (motif) -->
<div class="ring" style="width:620px;height:620px;right:-250px;top:150px;transform:rotate(18deg)">
  <svg viewBox="0 0 200 200"><path d="M100 12c50 0 88 37 88 87s-39 89-89 89S12 150 12 99 51 12 100 12z" fill="none" stroke="#E2CBAA" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="390 22 120 8"/>
  <path d="M100 20c44 0 80 34 80 79" fill="none" stroke="#E2CBAA" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>
</div>
<div class="ring" style="width:260px;height:260px;left:-120px;top:620px;transform:rotate(-40deg)">
  <svg viewBox="0 0 200 200"><path d="M100 14c48 0 86 38 86 86s-38 86-86 86S14 148 14 100 52 14 100 14z" fill="none" stroke="#E6D1B2" stroke-width="6" stroke-linecap="round" stroke-dasharray="300 30 160 40"/></svg>
</div>

<div class="grain"></div>

<div class="wrap">
  <header>
    <div class="logo">
      <span class="word">pixel<i>chai</i></span>
      <span class="vol">Vol. 04</span>
    </div>
    <span class="city">Bangalore</span>
  </header>

  <div class="kicker"><span class="dash"></span>Speaker announcement</div>

  <h1>Designing<br><span class="trust">trust<svg viewBox="0 0 300 46" preserveAspectRatio="none"><path d="M6 30 C 70 14, 160 10, 294 22 M 40 40 C 110 30, 200 28, 270 34" fill="none" stroke="#E9A23B" stroke-width="7" stroke-linecap="round"/></svg></span> <span class="soft">in</span><br>money apps.</h1>

  <div class="speaker">
    <div class="who">
      <span class="label">a talk by</span>
      <div class="name">Ananya Rao</div>
      <div class="role"><b>Principal Product Designer</b><br>at a fintech startup</div>
    </div>

    <div class="stamp">
      <svg viewBox="0 0 200 200">
        <defs><path id="c" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
        <circle cx="100" cy="100" r="98" fill="#C4552F"/>
        <circle cx="100" cy="100" r="58" fill="none" stroke="#F4E7D3" stroke-width="1.5" opacity=".55"/>
        <text font-family="DM Sans" font-weight="700" font-size="15" fill="#F4E7D3">
          <textPath href="#c" textLength="486" lengthAdjust="spacing">PIXEL CHAI • DESIGN MEETUP • BANGALORE • </textPath>
        </text>
      </svg>
      <div class="core"><span class="n">04</span><span class="t">Vol.</span></div>
    </div>
  </div>
</div>

<div class="rsvp"><span class="dot"></span>RSVP · link in bio</div>

<div class="ticket">
  <div class="cell"><div class="k">When</div><div class="v" id="date">7 Dec<small>Saturday</small></div></div>
  <div class="cell"><div class="k">Time</div><div class="v">5:00 PM<small>sharp-ish</small></div></div>
  <div class="cell"><div class="k">Where</div><div class="v">The Courtyard<small>Indiranagar, Bangalore</small></div></div>
</div>

</body>
</html>
